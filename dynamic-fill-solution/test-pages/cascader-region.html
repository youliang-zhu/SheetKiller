<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SheetKiller Cascader Region Test</title>
  </head>
  <body>
    <form>
      <label>籍贯</label>
      <select id="province">
        <option value="">请选择省</option>
        <option value="hunan">湖南省</option>
        <option value="guangdong">广东省</option>
      </select>
      <select id="city">
        <option value="">请选择市</option>
        <option value="loudi">娄底市</option>
        <option value="guangzhou">广州市</option>
      </select>
      <select id="district">
        <option value="">请选择区县</option>
        <option value="louxing">娄星区</option>
        <option value="tianhe">天河区</option>
      </select>
    </form>
  </body>
</html>
